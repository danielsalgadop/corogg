<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecos del Atlántico - Coro Hispano-Americano</title>
    <!-- Google Fonts para una tipografía elegante -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* --- VARIABLES Y CONFIGURACIÓN BASE --- */
        :root {
            --primary-dark: #111625;
            --accent-gold: #dfb76c;
            --spain-red: #aa1515;
            --usa-blue: #002868;
            --text-light: #f4f4f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-light);
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }

        /* --- FONDO DE PARTITURA DINÁMICA --- */
        .music-bg-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.05;
            pointer-events: none;
            background: linear-gradient(rgba(255,255,255,0) 0%, rgba(255,255,255,0) 90%, rgba(255,255,255,0.3) 90%, rgba(255,255,255,0.3) 100%);
            background-size: 100% 30px;
        }

        .floating-notes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* --- NAVEGACIÓN --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 10%;
            background: rgba(17, 22, 37, 0.95);
            border-bottom: 1px solid rgba(223, 183, 108, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-gold);
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            background: radial-gradient(circle, rgba(27,38,59,0.4) 0%, rgba(11,15,26,1) 100%);
        }

        .hero::before {
            content: "🎼";
            font-size: 12rem;
            position: absolute;
            opacity: 0.08;
            color: var(--accent-gold);
            top: 15%;
        }

        .flag-divider {
            display: flex;
            height: 4px;
            width: 150px;
            margin: 1.5rem auto;
            border-radius: 2px;
            overflow: hidden;
        }
        .flag-es { background: var(--spain-red); flex: 1; }
        .flag-us { background: var(--usa-blue); flex: 1; }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .btn {
            padding: 1rem 2.5rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid var(--accent-gold);
            background: transparent;
            color: var(--accent-gold);
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--accent-gold);
            color: var(--primary-dark);
            box-shadow: 0 0 20px rgba(223, 183, 108, 0.4);
        }

        /* --- SECCIÓN SOBRE NOSOTROS --- */
        .about {
            padding: 5rem 10%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .about-text h2 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: var(--accent-gold);
        }

        .clef-icon {
            font-size: 2rem;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        /* --- REPRODUCTOR DE AUDIO --- */
        .audio-showcase {
            background: rgba(17, 22, 37, 0.8);
            border: 1px solid rgba(223, 183, 108, 0.3);
            padding: 2.5rem;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: var(--accent-gold);
            color: var(--primary-dark);
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.05);
        }

        /* --- SECCIÓN REPERTORIO / PARTITURAS --- */
        .repertoire {
            padding: 5rem 10%;
            text-align: center;
        }

        .repertoire h2 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: var(--accent-gold);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 3rem 2rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "♩";
            position: absolute;
            font-size: 8rem;
            right: -10px;
            bottom: -30px;
            opacity: 0.03;
            color: #fff;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            background: rgba(223, 183, 108, 0.02);
        }

        .card h3 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        /* --- FORMULARIO DE CONTACTO / UNIRSE --- */
        .contact {
            padding: 5rem 10%;
            background: rgba(255, 255, 255, 0.02);
            text-align: center;
        }

        .contact-form {
            max-width: 500px;
            margin: 2rem auto 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .contact-form input, .contact-form textarea {
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
        }

        .contact-form input:focus, .contact-form textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        /* --- FOOTER --- */
        footer {
            padding: 2rem;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.6;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            nav { flex-direction: column; gap: 1rem; }
            .hero h1 { font-size: 2.2rem; }
            .about { grid-template-columns: 1fr; gap: 2rem; }
        }
    </style>
</head>
<body>

    <div class="music-bg-lines"></div>
    <!-- Contenedor para notas musicales generadas por JS -->
    <div class="floating-notes" id="notes-container"></div>

    <!-- Barra de navegación -->
    <nav>
        <div class="logo">
            <span>🎼</span> Ecos del Atlántico
        </div>
        <ul>
            <li><a href="#Inicio">Inicio</a></li>
            <li><a href="1a_1b_3_baritono.html">1a_1b_3_Baritono</a></li>
            <li><a href="#nosotros">Nosotros</a></li>
            <li><a href="#repertorio">Repertorio</a></li>
        </ul>
    </nav>

    <!-- Sección de Bienvenida (Hero) -->
    <section class="hero" id="inicio">
        <h1>Dos Naciones, Una Sola Voz</h1>
        <div class="flag-divider">
            <div class="flag-es"></div>
            <div class="flag-us"></div>

        <p>Uniendo las ricas tradiciones corales de España y los Estados Unidos a través de armonías transatlánticas.</p>
        <a href="#unirse" class="btn">Audicionar Ahora</a>

    <section class="about" id="nosotros">
        <div class="about-text">

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mezclador Local - Multipista</title>

    <!-- Carga tu copia local de Howler Core -->
    <script src="../howler.core.js"></script>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #121212;
            color: #e0e0e0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .contenedor {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
            color: #00e5ff;
        }
        .controles-globales {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        .btn-principal {
            background: #00e5ff;
            border: none;
            color: #121212;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 25px;
            transition: transform 0.2s ease;
        }
        .btn-principal:hover {
            transform: scale(1.03);
        }
        .pista {
            background: #282828;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .info-pista {
            min-width: 80px;
            font-size: 14px;
            font-weight: 500;
        }
        .fader-volumen {
            flex-grow: 1;
            accent-color: #00e5ff;
            cursor: pointer;
        }
        .valor-volumen {
            min-width: 35px;
            text-align: right;
            font-family: monospace;
            font-size: 14px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>
    <img src="voz1.png">
<div class="contenedor">
    <h1>VOZ1</h1>

    <div class="controles-globales">
        <!-- El botón está listo desde el inicio al ser archivos locales sin streaming -->
        <button id="btn-reproductor" class="btn-principal">▶ Reproducir Todo</button>
    </div>

    <div id="mezclador-pistas">
        <!-- La pista uno.mp3 se generará aquí -->
    </div>
</div>

<script>
// 1. Configuración de tu archivo local uno.mp3
// Si en el futuro añades más (dos.mp3, tres.mp3), solo agrégalos a esta lista
const fuentesPistas = [
    { id: 'metronomo', nombre: '🎵 Metrónomo', url: 'metronomo.mp3' },
     { id: 'guitarra', nombre: '🎵 Guitarra', url: 'guitarra.mp3' },
     { id: 'voz', nombre: '🎵 voz1', url: 'voz1.mp3' }
];

const pistas = {};
let enReproduccion = false;

const btnReproductor = document.getElementById('btn-reproductor');
const contenedorPistas = document.getElementById('mezclador-pistas');

// 2. Inicializar Howler apuntando a la carpeta local
fuentesPistas.forEach(pistaInfo => {
    pistas[pistaInfo.id] = new Howl({
        src: [pistaInfo.url],
        loop: true,        // Se repite en bucle al terminar
        volume: 0.7        // Arranca al 70% de volumen
    });

    // Construir los sliders en el HTML
    crearFaderInterfaz(pistaInfo);
});

// 3. Crear el control deslizante para la pista
function crearFaderInterfaz(pistaInfo) {
    const divPista = document.createElement('div');
    divPista.className = 'pista';

    const info = document.createElement('div');
    info.className = 'info-pista';
    info.textContent = pistaInfo.nombre;

    const input = document.createElement('input');
    input.type = 'range';
    input.className = 'fader-volumen';
    input.min = '0';
    input.max = '1';
    input.step = '0.01';
    input.value = '0.7';

    const valorTxt = document.createElement('div');
    valorTxt.className = 'valor-volumen';
    valorTxt.textContent = '70%';

    // Escuchar el movimiento del slider para cambiar el volumen
    input.addEventListener('input', (e) => {
        const volumen = parseFloat(e.target.value);
        pistas[pistaInfo.id].volume(volumen); // Comando nativo de Howler
        valorTxt.textContent = Math.round(volumen * 100) + '%';
    });

    divPista.appendChild(info);
    divPista.appendChild(input);
    divPista.appendChild(valorTxt);
    contenedorPistas.appendChild(divPista);
}

// 4. Lógica del botón de Play / Pause global
btnReproductor.addEventListener('click', () => {
    if (!enReproduccion) {
        // Da play a todos los objetos Howl del diccionario
        Object.keys(pistas).forEach(id => pistas[id].play());
        btnReproductor.textContent = '⏸ Pausar Todo';
        btnReproductor.style.background = '#ff007f';
        enReproduccion = true;
    } else {
        // Pausa todos los objetos Howl
        Object.keys(pistas).forEach(id => pistas[id].pause());
        btnReproductor.textContent = '▶ Reproducir Todo';
        btnReproductor.style.background = '#00e5ff';
        enReproduccion = false;
    }
});
</script>

</body>
</html>
